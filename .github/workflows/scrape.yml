name: Scrape Market Data

on:
  schedule:
    # TGJU: هر ۱۵ دقیقه
    - cron: '*/15 * * * *'
    # خودرو: هر ۱۲ ساعت (۶ صبح و ۶ عصر UTC)
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: ./scraper
        run: npm install
      
      - name: Scrape TGJU
        working-directory: ./scraper
        run: npm run scrape
      
      - name: Scrape Cars (12h)
        if: github.event.schedule == '0 6,18 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: ./scraper
        run: npm run scrape-cars
        continue-on-error: true
      
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Update [$(date -u '+%H:%M UTC')]"
          git push