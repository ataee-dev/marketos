<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت — قیمتو</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/app.css">
<style>
.admin-head{position:sticky;top:0;z-index:30;height:68px;padding:0 20px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:space-between;color:#fff}
.admin-head img{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.15);padding:5px}
.admin-wrap{max-width:1000px;margin:0 auto;padding:24px}
.card{padding:20px;border-radius:18px;background:var(--card);border:1px solid var(--border);margin-bottom:16px}
.card h3{font-size:15px;font-weight:800;margin-bottom:14px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat{padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--border)}
.stat small{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600}
.stat strong{display:block;font-size:22px;font-weight:900;color:var(--text)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
</style>
</head>
<body>

<div class="admin-head">
  <div style="display:flex;align-items:center;gap:10px">
    <img src="assets/logo.svg" alt="">
    <div>
      <strong style="display:block;font-size:15px;font-weight:900">قیمتو</strong>
      <small style="font-size:10.5px;opacity:.85">پنل مدیریت</small>
    </div>
  </div>
  <a href="index.html" class="btn btn-ghost" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.2)">بازگشت به اپ</a>
</div>

<div class="admin-wrap">

  <div class="stat-grid">
    <div class="stat"><small>وضعیت API</small><strong data-a-status>—</strong></div>
    <div class="stat"><small>نمادهای دریافتی</small><strong data-a-count>—</strong></div>
    <div class="stat"><small>آخرین دریافت</small><strong data-a-time>—</strong></div>
    <div class="stat"><small>خطای آخر</small><strong data-a-err style="font-size:13px">—</strong></div>
  </div>

  <div class="card">
    <h3>عملیات سریع</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" data-a-refresh>بروزرسانی داده</button>
      <button class="btn btn-ghost" data-a-test>تست API</button>
      <button class="btn btn-ghost" data-a-export>دانلود داده‌ها</button>
    </div>
  </div>

  <div class="card">
    <h3>لیست نمادها</h3>
    <div data-a-list></div>
  </div>

</div>

<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script>
(function(){
  function $(s){ return document.querySelector(s); }
  function $$(s){ return Array.from(document.querySelectorAll(s)); }

  function renderStats(){
    const count = Object.keys(API.getAll()).length;
    const t = API.getLastFetch();

    $('[data-a-status]').textContent = API.isFallback() ? 'Fallback' : (API.getLastError() ? 'خطا' : 'فعال');
    $('[data-a-count]').textContent = count + ' / ' + DATA.ASSETS.length;
    $('[data-a-time]').textContent = t ? U.time(t) : '—';
    $('[data-a-err]').textContent = API.getLastError() || '—';
  }

  function renderList(){
    const el = $('[data-a-list]');
    if(!el) return;
    el.innerHTML = DATA.ASSETS.slice(0, 30).map(a => {
      const l = API.getById(a.id);
      const has = l && l.price != null;
      return `<div class="row">
        <div><strong style="font-size:13px">${a.name}</strong><small style="display:block;color:var(--muted);font-size:11px">${a.code} · ${a.cat}</small></div>
        <div style="text-align:end">
          <strong style="display:block;font-size:13px;direction:ltr">${has ? U.price(a, l.price) : '—'}</strong>
          <small style="color:var(--muted)">${has ? (l.changePercent>=0?'▲':'▼') + ' ' + Math.abs(l.changePercent).toFixed(2) + '%' : '—'}</small>
        </div>
      </div>`;
    }).join('');
  }

  document.addEventListener('click', e => {
    if(e.target.closest('[data-a-refresh]')){
      API.fetchData(true).then(() => { renderStats(); renderList(); });
    }
    if(e.target.closest('[data-a-test]')){
      fetch('https://call2.tgju.org/ajax.json?_=' + Date.now())
        .then(r => r.json())
        .then(j => alert('✓ ' + Object.keys(j.current || {}).length + ' نماد'))
        .catch(err => alert('✗ ' + err.message));
    }
    if(e.target.closest('[data-a-export]')){
      const data = { cfg: CFG._c, fav: Storage.fav.get(), alerts: Storage.alerts.get(), pf: Storage.pf.get(), date: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'gheymato-backup.json';
      a.click();
      URL.revokeObjectURL(url);
    }
  });

  CFG.load();
  API.subscribe(() => { renderStats(); renderList(); });
  API.start(20000);
  renderStats();
  renderList();
})();
</script>
</body>
</html>
