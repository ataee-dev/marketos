<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>قیمتو — اتصال قطع شد</title>
<link rel="icon" type="image/png" href="assets/logo.png">

<style>
/* ═══════════════ FONT FACE ═══════════════ */
@font-face {
  font-family: 'Dana';
  src: url('assets/fonts/dana-regular.woff') format('woff');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Dana';
  src: url('assets/fonts/dana-medium.woff') format('woff');
  font-weight: 500;
  font-display: swap;
}
@font-face {
  font-family: 'Dana';
  src: url('assets/fonts/dana-demibold.woff') format('woff');
  font-weight: 600;
  font-display: swap;
}
@font-face {
  font-family: 'Dana';
  src: url('assets/fonts/dana-bold.woff') format('woff');
  font-weight: 700;
  font-display: swap;
}
@font-face {
  font-family: 'Dana';
  src: url('assets/fonts/dana-black.woff') format('woff');
  font-weight: 900;
  font-display: swap;
}

/* ═══════════════ RESET ═══════════════ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  overflow: hidden;
}

/* ═══════════════ VARIABLES — Dark ═══════════════ */
:root {
  --bg: #0a1310;
  --text: #e8f0ec;
  --text-muted: #7a8a83;
  --accent: #10b981;
  --accent-2: #059669;
  --down: #ef4444;
  --icon-color: #ef4444;
}

/* ═══════════════ LIGHT MODE ═══════════════ */
body.light {
  --bg: #f5f7f6;
  --text: #0a1310;
  --text-muted: #5a6a63;
  --accent: #10b981;
  --icon-color: #ef4444;
}

/* ═══════════════ BODY ═══════════════ */
body {
  font-family: 'Dana', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background 0.3s ease, color 0.3s ease;
  overscroll-behavior: none;
}

/* ═══════════════ CONTAINER ═══════════════ */
.offline {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  max-width: 360px;
  width: 100%;
  text-align: center;
}

/* ═══════════════ ICON ═══════════════ */
.offline-icon {
  width: 90px;
  height: 90px;
  color: var(--icon-color);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: iconFadeIn 0.6s ease;
}

.offline-icon svg {
  width: 100%;
  height: 100%;
  stroke-width: 1.3;
}

@keyframes iconFadeIn {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* ═══════════════ TITLE ═══════════════ */
.offline-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 10px;
  animation: fadeInUp 0.6s ease 0.15s backwards;
}

/* در دارک، سفید کامل */
body:not(.light) .offline-title {
  color: #ffffff;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ═══════════════ DESCRIPTION ═══════════════ */
.offline-desc {
  font-size: 13.5px;
  color: var(--text-muted);
  line-height: 1.8;
  margin-bottom: 28px;
  animation: fadeInUp 0.6s ease 0.25s backwards;
}

/* ═══════════════ RETRY BUTTON ═══════════════ */
.offline-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 36px;
  border-radius: 14px;
  border: 0;
  background: var(--accent);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.15s ease;
  animation: fadeInUp 0.6s ease 0.35s backwards;
}

.offline-btn:active {
  transform: scale(0.96);
  background: var(--accent-2);
}

.offline-btn svg {
  width: 17px;
  height: 17px;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ═══════════════ LOADING STATE ═══════════════ */
.offline-btn.is-loading {
  pointer-events: none;
  opacity: 0.75;
}

.offline-btn.is-loading svg {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ═══════════════ STATUS ═══════════════ */
.offline-status {
  margin-top: 20px;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  animation: fadeInUp 0.6s ease 0.45s backwards;
}

.offline-status .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--down);
  transition: background 0.3s ease;
}

.offline-status.online .dot {
  background: var(--accent);
}

/* ═══════════════ RESPONSIVE ═══════════════ */
@media (max-width: 380px) {
  .offline-icon {
    width: 76px;
    height: 76px;
  }
  .offline-title {
    font-size: 19px;
  }
  .offline-desc {
    font-size: 12.5px;
  }
  .offline-btn {
    padding: 12px 30px;
    font-size: 13px;
  }
}

@media (min-width: 768px) {
  .offline-icon {
    width: 100px;
    height: 100px;
  }
  .offline-title {
    font-size: 24px;
  }
}
</style>
</head>
<body>

<div class="offline" id="offline">

  <!-- آیکون -->
  <div class="offline-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 1l22 22"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <path d="M12 20h.01"/>
    </svg>
  </div>

  <!-- عنوان -->
  <h1 class="offline-title">اتصال قطع شد</h1>

  <!-- توضیحات -->
  <p class="offline-desc">
    لطفاً اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید
  </p>

  <!-- دکمه تلاش مجدد -->
  <button class="offline-btn" id="retryBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/>
      <path d="M21 3v5h-5"/>
    </svg>
    <span>تلاش مجدد</span>
  </button>

  <!-- وضعیت -->
  <div class="offline-status" id="status">
    <span class="dot"></span>
    <span id="statusText">اتصال قطع است</span>
  </div>

</div>

<script>
(function(){
  'use strict';

  var offline = document.getElementById('offline');
  var retryBtn = document.getElementById('retryBtn');
  var status = document.getElementById('status');
  var statusText = document.getElementById('statusText');

  /* ─── تشخیص تم ─── */
  try {
    var cfg = JSON.parse(localStorage.getItem('gheymato.cfg.v6') || '{}');
    if(cfg.theme === 'light'){
      document.body.classList.add('light');
    }
  } catch(e){}

  /* ─── گوش دادن به تغییر تم ─── */
  window.addEventListener('storage', function(e){
    if(e.key === 'gheymato.cfg.v6'){
      try {
        var cfg = JSON.parse(e.newValue || '{}');
        document.body.classList.toggle('light', cfg.theme === 'light');
      } catch(err){}
    }
  });

  /* ─── نمایش ─── */
  function show(){
    if(offline) offline.style.display = '';
  }

  /* ─── مخفی ─── */
  function hide(){
    if(offline) offline.style.display = 'none';
  }

  /* ─── بررسی وضعیت ─── */
  function updateStatus(){
    var online = navigator.onLine;

    if(online){
      status.classList.add('online');
      statusText.textContent = 'اتصال برقرار است';

      setTimeout(function(){
        if(window.parent !== window.self){
          try {
            window.parent.postMessage('offline:reconnect', '*');
          } catch(e){}
        }
      }, 1000);
    } else {
      status.classList.remove('online');
      statusText.textContent = 'اتصال قطع است';
    }
  }

  /* ─── تلاش مجدد ─── */
  function retry(){
    if(!navigator.onLine){
      statusText.textContent = 'هنوز آفلاین هستید';
      setTimeout(function(){
        statusText.textContent = 'اتصال قطع است';
      }, 2000);
      return;
    }

    retryBtn.classList.add('is-loading');

    setTimeout(function(){
      retryBtn.classList.remove('is-loading');

      fetch('data/latest.json?_=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
        .then(function(res){
          if(res.ok){
            updateStatus();
            if(window.parent !== window.self){
              try {
                window.parent.postMessage('offline:retry-success', '*');
              } catch(e){}
            } else {
              location.href = 'index.html';
            }
          } else {
            throw new Error('HTTP ' + res.status);
          }
        })
        .catch(function(){
          statusText.textContent = 'اتصال برقرار نشد';
          setTimeout(function(){
            statusText.textContent = 'اتصال قطع است';
          }, 2000);
        });
    }, 600);
  }

  retryBtn.addEventListener('click', retry);

  /* ─── Event Listeners ─── */
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);

  window.addEventListener('message', function(e){
    if(e.data === 'offline:show') show();
    if(e.data === 'offline:hide') hide();
  });

  /* ─── بررسی اولیه ─── */
  updateStatus();

  /* ─── بررسی دوره‌ای ─── */
  setInterval(updateStatus, 5000);

  /* ─── اعلام آماده بودن ─── */
  if(window.parent !== window.self){
    try {
      window.parent.postMessage('offline:ready', '*');
    } catch(e){}
  }

  /* ─── API ─── */
  window.Offline = {
    show: show,
    hide: hide,
    check: updateStatus
  };
})();
</script>

</body>
</html>
